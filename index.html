<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIBIKI</title>
<meta name="theme-color" content="#0f0c08" id="tc">
<link rel="stylesheet" href="assets/site.css">
<script>try{var t=localStorage.getItem('aibiki:theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body data-page="index">

<main class="wrap">
  <header class="masthead">
    <h1 id="s-title">&hellip;</h1>
    <p class="sub" id="s-sub"></p>
    <p class="tag" id="s-tag"></p>
  </header>

  <a class="resume" id="resume" hidden></a>

  <ul class="grid" id="grid" aria-label="Chapters"></ul>
  <p class="note" id="note" hidden></p>

  <footer class="foot">
    <span>updates continuously</span>
    <button class="btn" data-theme-toggle aria-label="Toggle dark or light theme" title="Toggle theme">&#9681;</button>
  </footer>
</main>

<script src="assets/site.js"></script>
</body>
</html>
